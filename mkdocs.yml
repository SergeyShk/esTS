site_name: esTS
site_description: "A library for extracting statistics from texts in Spanish"
repo_url: https://github.com/SergeyShk/esTS

nav:
    - Home:
      - About: index.md
      - Installation: installation.md
      - Exceptions and logging: exceptions.md
      - Authors: authors.md
    - Extraction:
      - Sentence extraction: extractors/sentences.md
      - Word extraction: extractors/words.md
      - Character N-gram extraction: extractors/char_ngrams.md
    - Syllables and stress: syllables.md
    - spaCy components: components.md
    - Statistics:
      - Basic statistics: stats/basic_stats.md
      - Readability metrics:
        - Metrics module: stats/readability_stats.md
        - Metric functions: stats/readability_stats_funcs.md
      - Lexical diversity metrics:
        - Metrics module: stats/diversity_stats.md
        - Metric functions: stats/diversity_stats_funcs.md
      - Morphological statistics: stats/morph_stats.md
      - Syntactic statistics: stats/syntax_stats.md
      - Cohesion statistics: stats/cohesion_stats.md
      - Lexical sophistication statistics:
        - Metrics module: stats/lexical_stats.md
        - Metric functions: stats/lexical_stats_funcs.md
      - Style metrics:
        - Metrics module: stats/style_stats.md
        - Metric functions: stats/style_stats_funcs.md
      - Phonostatistics:
        - Metrics module: stats/phon_stats.md
        - Metric functions: stats/phon_stats_funcs.md
      - Verse statistics:
        - Metrics module: stats/verse_stats.md
        - Metric functions: stats/verse_stats_funcs.md
    - Corpus measures:
      - Keywords: corpus/keyness.md
      - Collocations: corpus/collocations.md
      - Word dispersion: corpus/dispersion.md
      - KWIC concordance: corpus/kwic.md
      - Stylometry: corpus/stylometry.md
      - Corpus comparison: corpus/compare.md
    - Datasets:
      - Spanish-language literature: datasets/spanishliterature.md
      - Spanish sonnets: datasets/spanishsonnets.md
      - Frequency dictionary: datasets/freqdict.md
    - Visualizers:
      - Zipf's law: visualizers/zipf.md
      - Literature fingerprinting: visualizers/fingerprinting.md
      - Word tree: visualizers/word_tree.md
      - Corpus plots: visualizers/corpus.md
      - Stylometric plots: visualizers/stylometry.md
      - Vocabulary growth and frequency spectrum: visualizers/vocabulary.md
      - Sentence lengths: visualizers/sentences.md
      - Text highlighting: visualizers/highlight.md

theme:
  name: material
  language: en
  palette:
    primary: red
    accent: red
  font:
    text: Source Sans Pro
  features:
    - navigation.tabs

plugins:
  - search:
      lang:
        - en
        - es
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          site_description: "Biblioteca para extraer estadísticas de textos en español"
          nav_translations:
            Home: Inicio
            About: Acerca de
            Installation: Instalación
            Exceptions and logging: Excepciones y registro
            Authors: Autores
            Extraction: Extracción
            Sentence extraction: Extracción de oraciones
            Word extraction: Extracción de palabras
            Character N-gram extraction: Extracción de N-gramas de caracteres
            Syllables and stress: Sílabas y acento
            spaCy components: Componentes de spaCy
            Statistics: Estadísticas
            Basic statistics: Estadísticas básicas
            Readability metrics: Métricas de legibilidad
            Metrics module: Módulo de las métricas
            Metric functions: Funciones de las métricas
            Lexical diversity metrics: Métricas de diversidad léxica
            Morphological statistics: Estadísticas morfológicas
            Syntactic statistics: Estadísticas sintácticas
            Cohesion statistics: Estadísticas de cohesión
            Lexical sophistication statistics: Estadísticas de complejidad léxica
            Style metrics: Métricas de estilo
            Phonostatistics: Fonoestadística
            Verse statistics: Estadísticas del verso
            Corpus measures: Medidas de corpus
            Keywords: Palabras clave
            Collocations: Colocaciones
            Word dispersion: Dispersión de las palabras
            KWIC concordance: Concordancia KWIC
            Stylometry: Estilometría
            Corpus comparison: Comparación de corpus
            Datasets: Conjuntos de datos
            Spanish-language literature: Literatura en español
            Spanish sonnets: Sonetos en español
            Frequency dictionary: Diccionario de frecuencias
            Visualizers: Visualizaciones
            Zipf's law: Ley de Zipf
            Literature fingerprinting: Huella literaria
            Word tree: Árbol de palabras
            Corpus plots: Gráficos de corpus
            Stylometric plots: Gráficos estilométricos
            Vocabulary growth and frequency spectrum: Crecimiento del vocabulario y espectro de frecuencias
            Sentence lengths: Longitudes de las oraciones
            Text highlighting: Resaltado del texto

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SergeyShk
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/kouki91/

extra_css:
  - css/extra.css

extra_javascript:
  - js/config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js

markdown_extensions:
  - toc:
      permalink: True
  - attr_list
  - admonition
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: True
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

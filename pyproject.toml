[project]
name = "pyests"
version = "0.3.0.dev12"
description = "Spanish Texts Statistics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Sergey Shkarin", email = "kouki.sergey@gmail.com" }]
maintainers = [{ name = "Sergey Shkarin", email = "kouki.sergey@gmail.com" }]
keywords = [
    "NLP",
    "natural",
    "language",
    "processing",
    "CL",
    "computational",
    "linguistics",
    "text",
    "analytics",
    "spanish",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
    "Natural Language :: Spanish",
]
dependencies = [
    "graphviz>=0.20.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "simplemma>=2.0,<3",
    "spacy>=3.7",
]

[project.urls]
Homepage = "https://github.com/SergeyShk/esTS"
Repository = "https://github.com/SergeyShk/esTS"
Documentation = "https://sergeyshk.github.io/esTS/"
Issues = "https://github.com/SergeyShk/esTS/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.entry-points.spacy_factories]
ests_basic = "ests.components:BasicStatsComponent"
ests_readability = "ests.components:ReadabilityStatsComponent"
ests_diversity = "ests.components:DiversityStatsComponent"
ests_morph = "ests.components:MorphStatsComponent"
ests_syntax = "ests.components:SyntaxStatsComponent"
ests_cohesion = "ests.components:CohesionStatsComponent"
ests_lexical = "ests.components:LexicalStatsComponent"

[tool.hatch.build.targets.wheel]
packages = ["ests"]
exclude = ["ests/datasets/data"]

[tool.hatch.build.targets.sdist]
include = ["/ests", "/README.md", "/README.es.md", "/LICENSE.txt"]
exclude = ["ests/datasets/data"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "es-core-news-sm",
    "nltk>=3.9",
]
lint = ["mypy>=1.14", "pre-commit>=4.0", "ruff>=0.9"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "pymdown-extensions>=10.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["ests", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["ests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N801", "N802"]

[tool.mypy]
python_version = "3.11"
files = ["ests"]
pretty = true
show_traceback = true
color_output = true
allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-v --strict-markers --strict-config --doctest-modules"
testpaths = ["tests", "ests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "network: test downloads data from the network; disable with -m 'not network'",
]

[tool.coverage.run]
source = ["ests"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

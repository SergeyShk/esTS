name: examples

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Graphviz
        # Newer Ubuntu ships the layout engine neato of the network of collocations apart
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          echo "graph {}" | dot -Kneato -Tsvg > /dev/null || sudo apt-get install -y libgvplugin-neato-layout8
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run notebooks
        run: uv run --no-sync pytest --nbmake --overwrite examples -p no:cacheprovider
      - name: Compare the outputs with the committed ones
        run: uv run --no-sync python scripts/check_notebooks.py

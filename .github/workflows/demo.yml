name: demo

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Pin pyests to the released version
        if: github.event_name == 'release'
        run: |
          sed -i 's|^pyests @ .*|pyests==${{ github.event.release.tag_name }}|' demo/requirements.txt
          for attempt in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/pyests/${{ github.event.release.tag_name }}/json" > /dev/null && exit 0
            sleep 30
          done
          echo "pyests ${{ github.event.release.tag_name }} is not on PyPI" && exit 1
      - name: Upload demo to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uvx --from huggingface_hub hf upload SergeyShk/esTS demo . --repo-type space --commit-message "Update demo to ${{ github.ref_name }}"

name: demo

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Pin pyests to the released version
        if: github.event_name == 'release'
        run: |
          sed -i 's|^pyests @ .*|pyests==${{ github.event.release.tag_name }}|' demo/requirements.txt
          # The index pip reads is refreshed later than the JSON of the release
          for attempt in $(seq 1 60); do
            curl -sf -H "Accept: application/vnd.pypi.simple.v1+json" https://pypi.org/simple/pyests/ \
              | jq -e --arg version "${{ github.event.release.tag_name }}" '.versions | index($version)' > /dev/null \
              && exit 0
            sleep 30
          done
          echo "pyests ${{ github.event.release.tag_name }} is not in the index of PyPI" && exit 1
      - name: Upload demo to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uvx --from huggingface_hub hf upload SergeyShk/esTS demo . --repo-type space --commit-message "Update demo to ${{ github.ref_name }}"

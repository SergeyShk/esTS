name: build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group lint
      - name: Ruff
        run: |
          uv run --no-sync ruff check ests tests demo examples
          uv run --no-sync ruff format ests tests demo examples --check
      - name: Mypy
        run: uv run --no-sync mypy

  test:
    name: test (${{ matrix.python-version }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Fetch the pages of anyTS
        run: uv run --no-sync python scripts/core_docs.py
      - name: Run tests
        # The archives of the datasets are downloaded from master, where a new version
        # of one exists only after the merge: the network tests run in their own job
        run: uv run --no-sync pytest -m "not network" --cov ests

  network:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Fetch the pages of anyTS
        run: uv run --no-sync python scripts/core_docs.py
      - name: Run the network tests
        run: uv run --no-sync pytest -m network

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --only-group docs
      - name: Fetch the pages of anyTS
        run: uv run --no-sync python scripts/core_docs.py
      - name: Build docs
        run: uv run --no-sync mkdocs build --strict
